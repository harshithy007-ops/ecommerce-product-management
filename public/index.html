<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Product Management</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <h1>Product Management Dashboard</h1>
      </div>
    </header>

    <main class="container main-layout">
      <section class="form-panel card">
        <h2 id="formTitle">Add Product</h2>
        <form id="productForm">
          <input type="hidden" id="productId" />

          <div class="field-group">
            <label for="name">Product Name</label>
            <input id="name" type="text" placeholder="Enter product name" required />
          </div>

          <div class="field-group">
            <label for="category">Category</label>
            <input id="category" type="text" placeholder="Enter category" required />
          </div>

          <div class="field-group">
            <label for="price">Price</label>
            <input id="price" type="number" min="0" step="0.01" placeholder="Enter price" required />
          </div>

          <div class="field-group">
            <label for="stock">Stock Quantity</label>
            <input id="stock" type="number" min="0" placeholder="Enter stock" required />
          </div>

          <div class="field-group">
            <label for="image">Image URL</label>
            <input id="image" type="url" placeholder="Optional image URL" />
          </div>

          <div class="field-group">
            <label for="description">Description</label>
            <textarea id="description" rows="4" placeholder="Product description"></textarea>
          </div>

          <div class="button-row">
            <button type="submit" class="primary-btn">Save Product</button>
            <button type="button" id="cancelEdit" class="secondary-btn hidden">Cancel</button>
          </div>
        </form>
      </section>

      <section class="table-panel card">
        <div class="panel-header">
          <h2>Product List</h2>
          <div class="search-box">
            <input id="searchInput" type="search" placeholder="Search product..." />
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="productTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
